[package]
name = "nowaki"
description = "A fast full-stack web framework with a Rust toolchain and islands architecture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "fullstack", "islands", "ssr"]
categories = ["web-programming", "development-tools", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "nowaki"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["derive"] }
dunce = "1.0.5"
futures-util = "0.3.31"
getrandom = "0.4.3"
nowaki-core = { path = "../nowaki-core", version = "0.17.1" }
notify = "8.2.0"
# Content entries are read and rendered in parallel.
rayon = "1.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Font metrics for size-adjusted fallbacks (`fonts` in nowaki.config).
ttf-parser = "0.25.1"
tokio = { version = "1.52.3", features = ["full"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
comrak = { version = "0.59.0", default-features = false, features = ["syntect-fancy"] }
serde-saphyr = "2.1.1"
# TOML frontmatter (`+++` fences) in content entries; preserve_order keeps keys as written, like YAML.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }

[dev-dependencies]
tempfile = "3.25.0"
