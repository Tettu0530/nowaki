[package]
name = "nowaki-core"
description = "The engine of the nowaki CLI (an oxc-based transform pipeline, resolver, and module cache); not a supported API for other programs"
# Its own 0.x line, not the shared Nowaki version (docs/STABILITY.md): bumped when its code
# changes, and pinned with `=` by crates/nowaki/Cargo.toml.
version = "0.19.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bundler", "oxc", "web", "framework", "transform"]
categories = ["development-tools", "web-programming"]
readme = "../../README.md"

[dependencies]
anyhow = "1.0.102"
brotli = "9.1.1"
dashmap = "6.2.1"
dunce = "1.0.5"
flate2 = "1.1.10"
# Image asset optimization (pure Rust; no C-dependent codecs, to stay cross-compile safe).
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# AVIF for <Image> (pure Rust: rav1e without its asm, to stay cross-compile safe).
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
# Code highlighting for Markdown and MDX (syntect with pure-Rust regexes, two-face syntaxes).
comrak = { version = "0.59.0", default-features = false, features = ["syntect-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# MDX: markdown-rs parses .mdx (CommonMark + GFM + MDX) into mdast, which mdx.rs turns into TSX.
markdown = "1.0.0"
oxc = { version = "0.158.0", features = ["transformer", "codegen", "minifier", "semantic", "ast_visit"] }
oxc_resolver = "11.24.3"
rayon = "1.11.0"
# Routing config (rules.rs) and the client manifest read back for route budgets (page scripts).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
dunce = "1.0.5"
tempfile = "3.25.0"
