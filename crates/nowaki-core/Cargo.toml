[package]
name = "nowaki-core"
description = "Bundler core for Nowaki — an oxc-based transform pipeline, resolver, and module cache"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bundler", "oxc", "web", "framework", "transform"]
categories = ["development-tools", "web-programming"]
readme = "../../README.md"

[dependencies]
anyhow = "1.0.102"
brotli = "9.1.1"
dashmap = "6.2.1"
dunce = "1.0.5"
flate2 = "1.1.10"
# Image asset optimization (pure Rust; no C-dependent codecs, to stay cross-compile safe).
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# AVIF for <Image> (pure Rust: rav1e without its asm, to stay cross-compile safe).
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
oxc = { version = "0.135.0", features = ["transformer", "codegen", "minifier", "semantic", "ast_visit"] }
oxc_resolver = "11.21.0"
rayon = "1.11.0"
# Reads the client manifest back for route budgets (page scripts).
serde_json = "1.0.150"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[dev-dependencies]
dunce = "1.0.5"
tempfile = "3.25.0"
