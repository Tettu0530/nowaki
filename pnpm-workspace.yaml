packages:
  - "packages/*"
  # The nowaki CLI wrapper is not in the workspace: it ships prebuilt binaries via optionalDependencies
  # (@nowaki-dev/cli-*), so excluding it avoids needless resolution/downloads on a local pnpm install.
  # Publishing is done directly by scripts/build-npm.mjs + release CI via npm publish.
  - "!packages/nowaki-cli"
  - "examples/*"
  # Only the Nowaki benchmark comparison app is in the workspace (links runtime/preact).
  # The next/astro comparison apps are excluded (keeps heavy deps out of the default install; install them yourself).
  - "benchmarks/apps/nowaki-counter"
# Link in-workspace semver deps (create-nowaki-app -> create-nowaki, etc.) locally.
# With pnpm 10+'s default of false they're fetched from the registry, and a just-published version
# trips the minimumReleaseAge policy. Published package.json files keep plain semver.
linkWorkspacePackages: true
