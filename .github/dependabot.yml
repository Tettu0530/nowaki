version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      oxc:
        patterns: ["oxc*"]
      rust-deps:
        patterns: ["*"]
        exclude-patterns: ["oxc*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # Comparison apps for benchmarks/head-to-head.mjs (outside the pnpm workspace).
  - package-ecosystem: npm
    directories: ["/benchmarks/apps/next-counter", "/benchmarks/apps/astro-counter"]
    schedule:
      interval: weekly
    groups:
      benchmark-apps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
