version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      oxc:
        patterns: ["oxc*"]
      rust-deps:
        patterns: ["*"]
        exclude-patterns: ["oxc*"]
        update-types: [minor, patch]
    ignore:
      # oxc 0.147+ needs a newer Rust than our MSRV (1.95), and 0.156 breaks nowaki-core's API use.
      # Lift this together with the MSRV bump and the port (see ROADMAP).
      - dependency-name: "oxc"
        versions: [">=0.147"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # Comparison apps for benchmarks/head-to-head.mjs (outside the pnpm workspace).
  - package-ecosystem: npm
    directories: ["/benchmarks/apps/next-counter", "/benchmarks/apps/astro-counter"]
    schedule:
      interval: weekly
    groups:
      benchmark-apps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
