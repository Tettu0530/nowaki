version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # All oxc crates in one PR: they release in lockstep. A new oxc can raise its minimum Rust
      # version; the MSRV job fails then, and the PR raises `rust-version` and that job with it.
      oxc:
        patterns: ["oxc*"]
      rust-deps:
        patterns: ["*"]
        exclude-patterns: ["oxc*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  # Comparison apps for benchmarks/head-to-head.mjs and benchmarks/compare (outside the pnpm workspace).
  - package-ecosystem: npm
    directories:
      - "/benchmarks/apps/next-counter"
      - "/benchmarks/apps/astro-counter"
      - "/benchmarks/compare/apps/nowaki"
      - "/benchmarks/compare/apps/astro"
      - "/benchmarks/compare/apps/sveltekit"
      - "/benchmarks/compare/apps/next"
      - "/benchmarks/compare/apps/nuxt"
      - "/benchmarks/docs-site/apps/astro"
    schedule:
      interval: weekly
    groups:
      benchmark-apps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
