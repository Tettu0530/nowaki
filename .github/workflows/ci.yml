name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Daily, so new advisories and upstream breakage show up without a push.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
          install: "false"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm install too, so the CLI integration test builds the example app instead of skipping.
      - uses: ./.github/actions/setup
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          rust: "1.95"
          install: "false"
      - run: cargo check --workspace --all-targets --locked

  semver:
    name: Semver (nowaki-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: nowaki-core

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check licenses bans sources
      - run: pnpm audit --prod --audit-level=high

  e2e:
    name: E2E (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}
      - run: cargo build -p nowaki --locked
      - name: Router snapshot/unit test (scanRoutes + matchRoute)
        run: node scripts/router-test.mjs
      - name: Routing rules (redirects / rewrites / headers / basePath; shared fixture with nowaki-core)
        run: node scripts/rules-test.mjs
      - name: Routing rules at the JS fronts (front.mjs, Vercel routes against the shared fixture)
        run: node scripts/rules-front-test.mjs
      - name: Client router-cache unit test (matchBoundary + Router Cache TTL/LRU)
        run: node scripts/router-cache-test.mjs
      - name: SSG staticPaths expansion
        run: node scripts/static-paths-test.mjs
      - name: SSR React alias (react* in node_modules → preact/compat)
        run: node scripts/react-alias-test.mjs
      - name: CSP nonce injection (adapters)
        run: node scripts/csp-test.mjs
      - name: Live state signing (iat, max age, tampering)
        run: node scripts/live-sign-test.mjs
      - name: Jetstream rooms file (save, load, corrupt files)
        run: node scripts/live-rooms-file-test.mjs
      - name: ISR warm-up URL list
        run: node scripts/isr-urls-test.mjs
      - name: Same-origin host resolution (adapters + trust proxy)
        run: node scripts/origin-test.mjs
      - name: Dev SSR loader hooks (which modules re-evaluate after an edit)
        run: node scripts/loader-hooks-test.mjs
      - name: Request handler (layouts, routePath, commit hook)
        run: node scripts/handler-test.mjs
      - name: i18n (locale split and localePath against the shared fixture, hreflang, per-locale content)
        run: node scripts/i18n-test.mjs
      - name: Sessions (encryption, tampering, expiry, key rotation, store mode, CSRF read-only)
        run: node scripts/session-test.mjs
      - name: Live session hub (join/event, queue, timeout, cap, presence)
        run: node scripts/live-hub-test.mjs
      - name: Markdoc plugin (compile, validation errors, escaping, frontmatter)
        run: node --test "packages/nowaki-markdoc/test/*.test.mjs"
      - name: Typed env (env.ts schema, build / start / worker refusal, client import guard)
        run: node scripts/env-schema-test.mjs
      - name: Remote images (allow-list fixture, SSRF limits, build + dev against a local server)
        run: node scripts/images-fetch-test.mjs
      - name: nowaki upgrade (command surface + non-app guard)
        run: bash scripts/ci/e2e-upgrade.sh
      - name: Typed routes (typegen)
        run: bash scripts/ci/e2e-typegen.sh
      - name: Dev server (SSR, islands, API, routing, security)
        # Shorter than the job's 30 min: a hang fails this step with its log kept, instead of
        # the whole job being cancelled without one.
        timeout-minutes: 12
        run: bash scripts/ci/e2e-dev.sh
      - name: Production build + nowaki start (hoisting, ISR, Jetstream, security)
        # Shorter than the job's 30 min: a hang fails this step with its log kept, instead of
        # the whole job being cancelled without one.
        timeout-minutes: 12
        run: bash scripts/ci/e2e-prod.sh
      - name: Deploy adapters (node, static, cloudflare, vercel)
        # Shorter than the job's 30 min: a hang fails this step with its log kept, instead of
        # the whole job being cancelled without one.
        timeout-minutes: 12
        run: bash scripts/ci/e2e-adapters.sh

  browser:
    name: Browser (router, lazy hydration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo build -p nowaki --locked
      - name: Headless Chrome against nowaki start
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -e
          ./target/debug/nowaki build examples/hello
          ./target/debug/nowaki start examples/hello --port 8241 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8241/ >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8241 node scripts/lazy-hydration-test.mjs
          BASE=http://127.0.0.1:8241 node scripts/router-browser-test.mjs
          BASE=http://127.0.0.1:8241 EXPECT=ws node scripts/live-browser-test.mjs
          BASE=http://127.0.0.1:8241 EXPECT=post PAGE=/live-post node scripts/live-browser-test.mjs
          # Same pages under an enforced CSP: hydration, island CSS, and client navigation still work.
          NOWAKI_CSP=enforce ./target/debug/nowaki start examples/hello --port 8242 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8242/ >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8242 node scripts/lazy-hydration-test.mjs
          BASE=http://127.0.0.1:8242 node scripts/router-browser-test.mjs
          BASE=http://127.0.0.1:8242 EXPECT=ws node scripts/live-browser-test.mjs
          # The node adapter has no WS endpoint: live islands run over POST /__nowaki/live-event.
          ./target/debug/nowaki build examples/hello --adapter node
          PORT=8243 node examples/hello/dist/server/index.mjs &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8243/ >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8243 EXPECT=post node scripts/live-browser-test.mjs
          # Intercepting routes (a modal gallery): start, dev, an enforced CSP, basePath + locale.
          node scripts/slot-browser-test.mjs start dev csp combo --port 8250
          # i18n.detect: a click on <Link locale> in an island sets the nowaki_locale cookie, and
          # the next / follows it (a generated app on 8251).
          PORT=8251 node scripts/locale-browser-test.mjs
          # examples/gallery, the v0.18 exit criteria: modal on navigation, full page on reload,
          # under /gallery in ja, the language switcher's cookie, sign-in and sign-out (8252).
          node scripts/gallery-browser-test.mjs --port 8252

  jetstream-load:
    name: Jetstream load (1000 connections)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo build -p nowaki --locked
      - run: |
          set -e
          ./target/debug/nowaki build examples/hello
          ./target/debug/nowaki start examples/hello --port 8200 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8200/ >/dev/null && break; sleep 1; done
          RUST_PID=$(pgrep -f 'nowaki start examples/hello' | head -1)
          SIDECAR_PID=$(pgrep -f 'prod-sidecar.mjs' | head -1)
          node scripts/live-loadtest.mjs http://127.0.0.1:8200 1000 "$RUST_PID" "$SIDECAR_PID" > loadtest.txt
          { echo '```'; cat loadtest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  scaffold:
    name: Scaffold (create-nowaki templates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo build -p nowaki --locked
      - run: bash scripts/ci/e2e-scaffold.sh

  runtimes:
    name: Adapter runtime (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: cargo build -p nowaki --locked
      - run: bash scripts/ci/e2e-runtimes.sh ${{ matrix.runtime }}

  bench-regression:
    name: Client JS size (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cargo build -p nowaki --locked
      # Shipped JS is deterministic; fail if it exceeds benchmarks/baseline.json by more than +12%.
      - run: node benchmarks/check-regression.mjs

  perf:
    name: Performance (regression gate)
    # Pull requests only: head is measured against its base branch and the latest release tag
    # reachable from base, in the same job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Only when server, build, or runtime code changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(crates/|packages/nowaki-runtime/|Cargo\.lock$|benchmarks/ci-perf\.mjs$|benchmarks/ci-perf-app/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No server, build, or runtime change: skipped."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .perf-base
      - if: steps.scope.outputs.run == 'true'
        name: Check out the latest release
        id: release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' "$BASE_SHA")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list -n 1 "$TAG")" = "$BASE_SHA" ]; then
            echo "Base is $TAG: measured once."
            echo "dir=.perf-base" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach .perf-release "$TAG"
            echo "dir=.perf-release" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup
      - if: steps.scope.outputs.run == 'true'
        name: Install oha (pinned, checksum verified)
        run: |
          curl -sSfL -o /usr/local/bin/oha https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  /usr/local/bin/oha" | sha256sum -c -
          chmod +x /usr/local/bin/oha
      - if: steps.scope.outputs.run == 'true' && steps.release.outputs.dir == '.perf-release'
        name: Release binary cache key
        id: release-key
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "key=perf-nowaki-$TAG-$RUNNER_OS-$(rustc -V | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # The same key as perf-release-cache below, which fills it from main (PR caches aren't shared).
      - if: steps.scope.outputs.run == 'true' && steps.release.outputs.dir == '.perf-release'
        id: release-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-release/target/release/nowaki
          key: ${{ steps.release-key.outputs.key }}
      - if: steps.scope.outputs.run == 'true'
        # Separate target dirs: base and head have the same crate versions, and in a shared dir Cargo
        # took head's nowaki for already built (base's binary measured as head; it finished in 0.2 s).
        name: Build base, head and release (release profile, separate target dirs)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_DIR: ${{ steps.release.outputs.dir }}
          RELEASE_HIT: ${{ steps.release-cache.outputs.cache-hit }}
        run: |
          (cd .perf-base && pnpm install --frozen-lockfile)
          cargo build --release -p nowaki --locked --manifest-path .perf-base/Cargo.toml --target-dir .perf-base/target
          cargo build --release -p nowaki --locked
          if [ "$RELEASE_DIR" = .perf-release ]; then
            (cd .perf-release && pnpm install --frozen-lockfile)
            if [ "$RELEASE_HIT" != true ]; then
              cargo build --release -p nowaki --locked --manifest-path .perf-release/Cargo.toml --target-dir .perf-release/target
            fi
          fi
          # Guard: the two binaries must differ whenever the Rust code does.
          if ! git diff --quiet "$BASE_SHA" HEAD -- crates Cargo.lock; then
            if cmp -s target/release/nowaki .perf-base/target/release/nowaki; then
              echo "::error::head and base binaries are identical although crates/ changed"; exit 1
            fi
          fi
      - if: steps.scope.outputs.run == 'true'
        name: Measure head against base and the latest release
        env:
          RELEASE_DIR: ${{ steps.release.outputs.dir }}
          TAG: ${{ steps.release.outputs.tag }}
        run: node benchmarks/ci-perf.mjs --base .perf-base --head . --release "$RELEASE_DIR" --release-label "$TAG" --rounds 3

  perf-release-cache:
    name: Performance (release binary cache)
    # Builds the latest release's binary on main, where the cache is visible to every PR's perf job.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the latest release
        id: release
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git worktree add --detach .perf-release "$TAG"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Release binary cache key
        id: release-key
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "key=perf-nowaki-$TAG-$RUNNER_OS-$(rustc -V | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - id: release-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perf-release/target/release/nowaki
          key: ${{ steps.release-key.outputs.key }}
      - if: steps.release-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p nowaki --locked --manifest-path .perf-release/Cargo.toml --target-dir .perf-release/target

  npm-cli:
    name: npm CLI wrapper (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Assemble host package + resolve through JS shim
        run: |
          node scripts/build-npm.mjs linux-x64-gnu
          # Build a layout equivalent to a real install (real files), then --version via the wrapper shim
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/node_modules/nowaki" "$ROOT/node_modules/@nowaki-dev"
          cp packages/nowaki-cli/package.json "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/bin packages/nowaki-cli/lib "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/npm/linux-x64-gnu "$ROOT/node_modules/@nowaki-dev/cli-linux-x64-gnu"
          VER=$(node -p "require('./packages/nowaki-cli/package.json').version")
          OUT=$(node "$ROOT/node_modules/nowaki/bin/nowaki.js" --version)
          echo "shim output: '$OUT' (expected 'nowaki $VER')"
          test "$OUT" = "nowaki $VER"
          # the exit code comes through (clap exits 2 on an unknown flag)
          set +e; node "$ROOT/node_modules/nowaki/bin/nowaki.js" --no-such-flag 2>/dev/null; CODE=$?; set -e
          test "$CODE" = 2
          # the shim's own process becomes the binary (process.execve; no resident Node, #91):
          # a stand-in binary that prints its PID must print the PID node was started with
          BIN="$ROOT/node_modules/@nowaki-dev/cli-linux-x64-gnu/bin/nowaki"
          test -f "$BIN"
          printf '#!/bin/sh\necho $$\n' > "$BIN"
          node "$ROOT/node_modules/nowaki/bin/nowaki.js" > "$ROOT/pid.txt" &
          NODE_PID=$!; wait $NODE_PID
          echo "node pid $NODE_PID, binary pid $(cat "$ROOT/pid.txt")"
          test "$(cat "$ROOT/pid.txt")" = "$NODE_PID"

  docs:
    name: Docs (links, typos, English-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/ci/check-english.mjs
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      # Offline on PRs (relative links and anchors only); external links are checked weekly.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments './**/*.md' --exclude-path node_modules --exclude-path target --exclude-path examples/hello/content
          fail: true

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go and pipx are preinstalled on ubuntu runners; versions are pinned here.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: pipx run zizmor==1.31.1 --persona=regular --min-severity=medium .github/workflows .github/actions

  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/ci/pr-size.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}

  # The single required status check: green only when every job above passed
  # (pr-size is skipped outside pull requests).
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, msrv, semver, security, e2e, browser, jetstream-load, scaffold, runtimes, bench-regression, perf, perf-release-cache, npm-cli, docs, workflows, pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "results: $RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then exit 1; fi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
