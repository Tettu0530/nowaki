name: Publish npm packages

# Publishes the platform-independent npm packages (runtime / markdoc / create-nowaki / create-nowaki-app).
# Per-platform CLI binaries are handled by release.yml.
# Bump the version in package.json first, then run this workflow manually. A version that is
# already on npm is skipped (scripts/ci/npm-publish-if-new.sh), so `all` is safe after a partial bump.
# Requires NPM_TOKEN (a 2FA-bypass Automation/Granular token) in repo Secrets.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        default: all
        options:
          - all
          - runtime
          - markdoc
          - create-nowaki
          - create-nowaki-app

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish @nowaki-dev/runtime
        if: ${{ inputs.package == 'all' || inputs.package == 'runtime' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-publish-if-new.sh"
        working-directory: packages/nowaki-runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @nowaki-dev/markdoc
        if: ${{ inputs.package == 'all' || inputs.package == 'markdoc' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-publish-if-new.sh"
        working-directory: packages/nowaki-markdoc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-nowaki
        if: ${{ inputs.package == 'all' || inputs.package == 'create-nowaki' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-publish-if-new.sh"
        working-directory: packages/create-nowaki
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-nowaki-app
        if: ${{ inputs.package == 'all' || inputs.package == 'create-nowaki-app' }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-publish-if-new.sh"
        working-directory: packages/create-nowaki-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
