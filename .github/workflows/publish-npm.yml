name: Publish npm packages

# Publishes the platform-independent npm packages (runtime / create-nowaki / create-nowaki-app).
# Per-platform CLI binaries are handled by release.yml.
# Bump the version in package.json first, then run this workflow manually.
# Requires NPM_TOKEN (a 2FA-bypass Automation/Granular token) in repo Secrets.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        default: all
        options:
          - all
          - runtime
          - create-nowaki
          - create-nowaki-app

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish @nowaki-dev/runtime
        if: ${{ inputs.package == 'all' || inputs.package == 'runtime' }}
        run: npm publish --access public
        working-directory: packages/nowaki-runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-nowaki
        if: ${{ inputs.package == 'all' || inputs.package == 'create-nowaki' }}
        run: npm publish --access public
        working-directory: packages/create-nowaki
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-nowaki-app
        if: ${{ inputs.package == 'all' || inputs.package == 'create-nowaki-app' }}
        run: npm publish --access public
        working-directory: packages/create-nowaki-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
