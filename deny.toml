# cargo-deny: licenses, bans, and sources. Advisories are covered by `cargo audit`.
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
  # Unicode's data-file license (OSI approved), via comrak's finl_unicode.
  "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# rav1e (the AVIF encoder behind `?image`) depends on libfuzzer-sys only under `cfg(fuzzing)`, so
# it is never built into nowaki; cargo-deny checks every target, hence the exception.
exceptions = [{ name = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
