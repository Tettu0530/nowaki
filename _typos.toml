[files]
# Raw benchmark runs are generated data: they list every built file, and bundlers name files
# with base64-like hashes (e.g. Nuxt's BcNtoJ_O.js) that change on every run.
# Font files and their third-party license text (examples/hello/fonts/OFL.txt) aren't ours to edit.
extend-exclude = ["*.lock", "pnpm-lock.yaml", "*.svg", "benchmarks/**/results/*.jsonl", "*.ttf", "*.woff2", "OFL.txt"]

[default]
# Hex ids in server-function fixtures, content hashes in built file names (benchmark results
# list them, e.g. islands.8916abd3.js), and plurals of acronyms the word splitter cuts up.
extend-ignore-re = ["[0-9a-f]{16}", "\\.[0-9a-f]{8}\\.(js|css)", "PNGs", "MISSes"]

[default.extend-identifiers]
als = "als" # AsyncLocalStorage instance

[default.extend-words]
Vor = "Vor" # VorEdge
